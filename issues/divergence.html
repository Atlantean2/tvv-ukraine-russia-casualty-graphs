<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Ukraine Russia Casualty Graphs — divergence</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#divergence")</script></head><body><main id="issue"><h2 class="desk">Divergence and Civilians</h2><p>The swap ratio against the Western-implied killed ratio, and UN-verified civilian casualties.</p><figure class="g"><img src="img/divergence-08.webp" alt="Swap ratio vs Western killed ratio" loading="lazy"><figcaption><span class="t">Swap ratio vs Western killed ratio.</span> If the swap ratio reflected deaths, Ukraine would be losing 18-40 soldiers per Russian; Western estimates say the reverse (Russia ~1.7x Ukraine&#x27;s dead in 2023, ~3x in 2026). Both cannot be death ratios. Swaps reflect who holds the battlefield; Western methods are not public. [Two ratios diverge. Data: Oct 22, 2026]<br><span class="s">Source: <a href="https://en.interfax.com.ua/news/general/1147619.html" target="_blank" rel="noopener">https://en.interfax.com.ua/news/general/1147619.html</a> <a href="https://kyivindependent.com/kyiv-repatriates-528-bodies-that-russia-claims-are-fallen-ukrainian-soldiers/" target="_blank" rel="noopener">https://kyivindependent.com/kyiv-repatriates-528-bodies-that-russia-claims-are-fallen-ukrainian-soldiers/</a> <a href="https://kyivindependent.com/ukraine-repatriates-1-000-fallen-soldiers-in-latest-exchange/" target="_blank" rel="noopener">https://kyivindependent.com/ukraine-repatriates-1-000-fallen-soldiers-in-latest-exchange/</a> <a href="https://www.nytimes.com/2023/08/18/us/politics/ukraine-russia-war-casualties.html" target="_blank" rel="noopener">https://www.nytimes.com/2023/08/18/us/politics/ukraine-russia-war-casualties.html</a> <a href="https://www.csis.org/analysis/russian-blood-and-treasure-ballooning-costs-putins-war" target="_blank" rel="noopener">https://www.csis.org/analysis/russian-blood-and-treasure-ballooning-costs-putins-war</a> <a href="https://voxukraine.org/en/fake-ukraine-suffers-greater-losses-because-it-returns-18-times-fewer-bodies-of-soldiers-to-russia" target="_blank" rel="noopener">https://voxukraine.org/en/fake-ukraine-suffers-greater-losses-because-it-returns-18-times-fewer-bodies-of-soldiers-to-russia</a></span></figcaption></figure><figure class="g"><img src="img/divergence-09.webp" alt="UN-verified civilian casualties, Jan-Sep 2024-2026" loading="lazy"><figcaption><span class="t">UN-verified civilian casualties, Jan-Sep 2024-2026.</span> Killed: 1,607 to 1,943 to 2,570; injured: 6,764 to 9,233 to 15,211 (Jan-Sep). OHCHR says actual numbers are likely considerably higher. Covers areas OHCHR can verify, mainly Ukrainian-controlled territory. [Civilian casualties OHCHR. Data: Sep 30, 2026]<br><span class="s">Source: <a href="https://ukraine.ohchr.org/en/Protection-of-Civilians-in-Armed-Conflict-September-2026" target="_blank" rel="noopener">https://ukraine.ohchr.org/en/Protection-of-Civilians-in-Armed-Conflict-September-2026</a></span></figcaption></figure></main></body></html>
